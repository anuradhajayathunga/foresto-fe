name: Build and deploy Python app to Azure Web App - foresto-backend

on:
  push:
    branches:
      - feat/backend-deployment
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify backend structure
        run: |
          echo "====== Backend folder ======"
          ls -la web/backend

          echo "====== Checking required files ======"
          test -f web/backend/manage.py && echo "manage.py exists"
          test -f web/backend/requirements.txt && echo "requirements.txt exists"
          test -f web/backend/startup.sh && echo "startup.sh exists"
          test -d web/backend/config && echo "config folder exists"
          test -f web/backend/config/wsgi.py && echo "config/wsgi.py exists"
          test -f web/backend/config/settings.py && echo "config/settings.py exists"

      - name: Install dependencies for validation
        working-directory: web/backend
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            web/backend
            !web/backend/antenv/
            !web/backend/.venv/
            !web/backend/__pycache__/
            !web/backend/**/__pycache__/
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: ./deploy

      - name: Verify downloaded backend artifact
        run: |
          echo "====== Deploy folder ======"
          ls -la ./deploy

          echo "====== Checking required files ======"
          test -f ./deploy/manage.py && echo "manage.py exists"
          test -f ./deploy/requirements.txt && echo "requirements.txt exists"
          test -f ./deploy/startup.sh && echo "startup.sh exists"
          test -f ./deploy/config/wsgi.py && echo "config/wsgi.py exists"
          test -f ./deploy/config/settings.py && echo "config/settings.py exists"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E9C36A3E98034190B99F7BFAC87B1328 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4D625240F5A24E0C9664B4798C422B9C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8668451ACFB24DF39D8A93A8CF4F6B9A }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "foresto-backend"
          slot-name: "Production"
          package: ./deploy