name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "web/frontend/**"
      - ".github/workflows/deploy-frontend-azure.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─── Build & Deploy to Azure Static Web Apps ──────────────────────────────
  build-and-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Skip the deploy step on closed PRs (SWA handles cleanup automatically)
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          #
          # Paths inside the repository
          app_location: "web/frontend"       # Location of the Next.js source
          output_location: ""                # SWA handles Next.js build output automatically
          #
          # Runtime environment variables (available at build time)
          app_build_command: "npm run build"
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}

  # ─── Close staging environment for closed PRs ─────────────────────────────
  close-staging:
    name: Close Staging Environment
    runs-on: ubuntu-latest
    permissions: {}
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: "web/frontend"
