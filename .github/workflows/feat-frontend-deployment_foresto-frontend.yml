name: Build and deploy Next.js app to Azure Web App - foresto-frontend

on:
  push:
    branches:
      - feat/frontend-deployment
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web/frontend

      - name: Build Next.js app
        run: npm run build
        working-directory: web/frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_ML_API_URL: ${{ secrets.NEXT_PUBLIC_ML_API_URL }}

      - name: Fix Next.js standalone structure
        run: |
          echo "Copying public folder..."
          cp -r web/frontend/public web/frontend/.next/standalone/public || true

          echo "Copying static folder..."
          mkdir -p web/frontend/.next/standalone/.next
          cp -r web/frontend/.next/static web/frontend/.next/standalone/.next/static

      - name: Verify final standalone package
        run: |
          echo "====== Standalone Folder ======"
          ls -la web/frontend/.next/standalone

          echo "====== Check server.js ======"
          test -f web/frontend/.next/standalone/server.js && echo "server.js exists"

          echo "====== Check package.json ======"
          test -f web/frontend/.next/standalone/package.json && echo "package.json exists"

          echo "====== Check public ======"
          test -d web/frontend/.next/standalone/public && echo "public exists"

          echo "====== Check .next/static ======"
          test -d web/frontend/.next/standalone/.next/static && echo ".next/static exists"

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: web/frontend/.next/standalone
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./deploy

      - name: Verify downloaded artifact
        run: |
          echo "====== Deploy Folder ======"
          ls -la ./deploy

          echo "====== Check required files ======"
          test -f ./deploy/server.js && echo "server.js exists"
          test -f ./deploy/package.json && echo "package.json exists"
          test -d ./deploy/public && echo "public exists"
          test -d ./deploy/.next/static && echo ".next/static exists"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_133B671267864C168C1FC57BB80DF8AF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_14588C9815304B2DAB31C3D54442E4ED }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8EE9A7B8AC3E4CB38D75B298EE4BEF31 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "foresto-frontend"
          slot-name: "Production"
          package: ./deploy