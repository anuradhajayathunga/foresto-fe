name: Build and deploy Node.js app to Azure Web App - foresto-frontend

on:
  push:
    branches:
      - feat/frontend-deployment
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ✅ Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Step 2: Setup Node.js
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: web/frontend/package-lock.json

      # ✅ Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci
        working-directory: web/frontend

      # ✅ Step 4: Build Next.js with env vars injected
      - name: Build Next.js app
        run: npm run build
        working-directory: web/frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_ML_API_URL: ${{ secrets.NEXT_PUBLIC_ML_API_URL }}

      # ✅ Step 5: Copy public and static into standalone
      - name: Copy public and static assets into standalone
        run: |
          cp -r web/frontend/public web/frontend/.next/standalone/public
          cp -r web/frontend/.next/static web/frontend/.next/standalone/.next/static

      # ✅ Step 6: Upload standalone folder as artifact
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: web/frontend/.next/standalone
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # ✅ Step 1: Download artifact
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      # ✅ Step 2: Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_133B671267864C168C1FC57BB80DF8AF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_14588C9815304B2DAB31C3D54442E4ED }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8EE9A7B8AC3E4CB38D75B298EE4BEF31 }}

      # ✅ Step 3: Deploy to Azure Web App
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "foresto-frontend"
          slot-name: "Production"
          package: .
