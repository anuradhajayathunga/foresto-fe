name: Build and deploy Node.js app to Azure Web App - foresto-frontend

on:
  push:
    branches:
      - feat/frontend-deployment
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ✅ Step 1: Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Step 2: Setup Node
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: web/frontend/package-lock.json

      # ✅ Step 3: Install all dependencies
      - name: Install dependencies
        run: npm ci
        working-directory: web/frontend

      # ✅ Step 4: Build with env vars injected
      - name: Build Next.js app
        run: npm run build
        working-directory: web/frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_ML_API_URL: ${{ secrets.NEXT_PUBLIC_ML_API_URL }}

      # ✅ Step 5: Check .next structure and copy assets
      - name: Check and copy Next.js output
        run: |
          echo "====== .next structure after build ======"
          ls -la web/frontend/.next/ || echo ".next not found"
          echo "====== .next/static folder ======"
          ls -la web/frontend/.next/static/ 2>/dev/null || echo ".next/static not found"
          echo "====== .next/standalone structure ======"
          ls -la web/frontend/.next/standalone/
          echo "====== Copying assets to standalone ======"
          mkdir -p web/frontend/.next/standalone/.next
          cp -r web/frontend/public web/frontend/.next/standalone/public 2>/dev/null || echo "ℹ️  public already exists or copy skipped"
          cp -r web/frontend/.next/static web/frontend/.next/standalone/.next/static 2>/dev/null || echo "ℹ️  static copy skipped (may already exist or not found)"

      # ✅ Step 6: Verify final artifact structure
      - name: Verify standalone output before upload
        run: |
          echo "====== Standalone Root ======"
          ls -la web/frontend/.next/standalone/
          echo "====== server.js check ======"
          test -f web/frontend/.next/standalone/server.js && echo "✅ server.js EXISTS" || echo "❌ server.js MISSING"
          echo "====== .next subfolder ======"
          ls -la web/frontend/.next/standalone/.next/ 2>/dev/null || echo ".next subfolder empty or missing"
          echo "====== static files ======"
          ls -la web/frontend/.next/standalone/.next/static/ 2>/dev/null || echo "static files not found"
          echo "====== public files ======"
          ls -la web/frontend/.next/standalone/public/ 2>/dev/null || echo "public folder not found"

      # ✅ Step 7: Upload standalone as artifact
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: web/frontend/.next/standalone
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # ✅ Step 1: Download artifact
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./deploy

      # ✅ Step 2: Verify downloaded files
      - name: Verify downloaded files
        run: |
          echo "====== Deploy folder ======"
          ls -la ./deploy/
          echo "====== server.js check ======"
          test -f ./deploy/server.js && echo "✅ server.js EXISTS" || echo "❌ server.js MISSING"
          echo "====== .next folder ======"
          ls -la ./deploy/.next/

      # ✅ Step 3: Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_133B671267864C168C1FC57BB80DF8AF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_14588C9815304B2DAB31C3D54442E4ED }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8EE9A7B8AC3E4CB38D75B298EE4BEF31 }}

      # ✅ Step 4: Deploy standalone folder
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "foresto-frontend"
          slot-name: "Production"
          package: ./deploy
