name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - "web/backend/**"
      - ".github/workflows/deploy-backend-azure.yml"
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_BACKEND_APP_NAME }}   # Set in repo → Settings → Variables
  REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}           # e.g. myregistry.azurecr.io
  IMAGE_NAME: foresto-backend

jobs:
  # ─── Build & push Docker image to Azure Container Registry ────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./web/backend
          file: ./web/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to Azure App Service ──────────────────────────────────────────
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    permissions: {}

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy container to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Run database migrations via Azure CLI
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp ssh \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --command "python manage.py migrate --noinput"
