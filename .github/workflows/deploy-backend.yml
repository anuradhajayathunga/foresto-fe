name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - "web/backend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # gunicorn and whitenoise are listed in requirements.txt
          pip install -r requirements.txt

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_BACKEND_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: web/backend
          # This startup-command overrides whatever is configured in the Azure portal.
          # It runs startup.sh which calls migrate, collectstatic, then gunicorn.
          startup-command: "bash startup.sh"
